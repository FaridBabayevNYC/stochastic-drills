<style>
/* Layout: paper canvas, white cards, teal accent; topic rail on the left, problems on the right. */
:root {
  --bg: #f4f3ee; --surface: #ffffff; --tint: #edebe3; --inset: #faf9f5;
  --ink: #26241f; --ink-2: #514e45; --ink-3: #625e55; --ink-4: #706b60;
  --line: #e4e1d8; --line-strong: #d3cfc4; --line-input: #878276;
  --accent: #89acb2; --accent-hover: #6f979c; --accent-fg: #1c1c1a; --accent-text: #4d6f74; --accent-soft: #dce9e8; --path: #4d8990;
  --easy: #3d6b52; --med: #855c1c; --hard: #a24a36;
  --easy-soft: color-mix(in srgb, var(--easy) 14%, var(--surface));
  --med-soft: color-mix(in srgb, var(--med) 14%, var(--surface));
  --hard-soft: color-mix(in srgb, var(--hard) 12%, var(--surface));
  --shadow-sm: 0 1px 2px rgba(38, 36, 31, 0.04), 0 1px 3px rgba(38, 36, 31, 0.06);
  --ui: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16150f; --surface: #1e1d16; --tint: #2a281f; --inset: #26241c;
    --ink: #f1efe6; --ink-2: #cdc9bc; --ink-3: #b4afa2; --ink-4: #958f80;
    --line: #322f26; --line-strong: #3f3b30; --line-input: #7a7463;
    --accent: #89acb2; --accent-hover: #9fbdc2; --accent-fg: #16150f; --accent-text: #89acb2; --accent-soft: #2c3836; --path: #88c9d4;
    --easy: #7db390; --med: #cf9a52; --hard: #d9806b;
    --easy-soft: color-mix(in srgb, var(--easy) 18%, var(--surface));
    --med-soft: color-mix(in srgb, var(--med) 18%, var(--surface));
    --hard-soft: color-mix(in srgb, var(--hard) 16%, var(--surface));
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #16150f; --surface: #1e1d16; --tint: #2a281f; --inset: #26241c;
  --ink: #f1efe6; --ink-2: #cdc9bc; --ink-3: #b4afa2; --ink-4: #958f80;
  --line: #322f26; --line-strong: #3f3b30; --line-input: #7a7463;
  --accent: #89acb2; --accent-hover: #9fbdc2; --accent-fg: #16150f; --accent-text: #89acb2; --accent-soft: #2c3836; --path: #88c9d4;
  --easy: #7db390; --med: #cf9a52; --hard: #d9806b;
  --easy-soft: color-mix(in srgb, var(--easy) 18%, var(--surface));
  --med-soft: color-mix(in srgb, var(--med) 18%, var(--surface));
  --hard-soft: color-mix(in srgb, var(--hard) 16%, var(--surface));
  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--ui); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 28px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; margin-right: auto; min-width: 0; }
.brand canvas { width: 54px; height: 34px; display: block; flex: none; }
.prod { min-width: 0; }
.prod b { display: block; font-weight: 700; font-size: 18px; letter-spacing: -0.02em; line-height: 1.2; }
.prod span { font-size: 12px; color: var(--ink-3); }
.meters { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.meter { min-width: 84px; }
.meter .lab { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: var(--ink-3); }
.meter .lab b { font-weight: 600; font-variant-numeric: tabular-nums; color: var(--ink); }
.bar { height: 5px; border-radius: 3px; background: var(--tint); margin-top: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 3px; background: var(--accent); width: 0; }
.bar.easy i { background: var(--easy); } .bar.medium i { background: var(--med); } .bar.hard i { background: var(--hard); }
.btn { display: inline-block; text-decoration: none; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--r-md); padding: 8px 14px; font-weight: 600; font-size: 14px; box-shadow: var(--shadow-sm); }
.btn:hover { background: var(--inset); border-color: var(--ink-4); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.quiet { border-color: transparent; background: transparent; color: var(--ink-2); padding-inline: 8px; box-shadow: none; font-weight: 500; }
.btn.quiet:hover { color: var(--ink); background: var(--tint); }
.btn:disabled { opacity: 0.45; cursor: default; }

/* layout */
.layout { display: grid; grid-template-columns: 268px minmax(0, 1fr); gap: 32px; margin-top: 24px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 40px); overflow-y: auto; padding-right: 4px; }
.rail h2 { font-size: 12px; font-weight: 500; color: var(--ink-3); margin: 0 0 8px 10px; }
.rail ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.topic { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; width: 100%; text-align: left; text-decoration: none;
  padding: 8px 10px; border-radius: var(--r-sm); border: 0; background: transparent; }
.topic:hover { background: var(--tint); }
.topic[aria-current="true"] { background: var(--accent-soft); }
.topic .n { font-weight: 500; font-size: 14px; overflow-wrap: anywhere; }
.topic[aria-current="true"] .n { font-weight: 600; }
.topic .c { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; align-self: center; }
.topic .bar { grid-column: 1 / -1; height: 3px; margin-top: 3px; }
main { min-width: 0; }

/* list view */
.head h1 { font-weight: 700; font-size: clamp(28px, 24.7px + 0.88vw, 36px); line-height: 1.12; letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
.head p { margin: 8px 0 0; color: var(--ink-2); max-width: 68ch; font-size: 16px; }
.path { margin-top: 16px; }
.path canvas { width: 100%; height: 64px; display: block; }
.path figcaption { font-size: 12px; color: var(--ink-4); margin-top: 2px; font-variant-numeric: tabular-nums; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; margin: 20px 0 12px; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: transparent; padding: 6px 12px; font-size: 13px; color: var(--ink-2); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); font-weight: 600; }
.filters input[type="search"], .filters select { border: 1px solid var(--line-input); background: var(--surface); border-radius: var(--r-sm); padding: 6px 10px; font-size: 13px; min-width: 0; }
.filters input[type="search"] { flex: 1 1 160px; max-width: 280px; }
.count { margin-left: auto; font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.list { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--shadow-sm); }
.row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 11px 16px; text-decoration: none; border-top: 1px solid var(--line); }
li:first-child > .row { border-top: 0; }
.row:hover { background: var(--inset); }
.row .t { font-weight: 600; overflow-wrap: anywhere; }
.row .sub { display: block; font-size: 12px; color: var(--ink-3); font-weight: 400; }
.mark { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; font-size: 11px; line-height: 1; font-weight: 700; }
.mark.ok { background: var(--easy); border-color: var(--easy); color: var(--surface); }
.mark.miss { background: var(--hard); border-color: var(--hard); color: var(--surface); }
.pill { font-size: 11px; font-weight: 600; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.pill.easy { color: var(--easy); background: var(--easy-soft); }
.pill.medium { color: var(--med); background: var(--med-soft); }
.pill.hard { color: var(--hard); background: var(--hard-soft); }
.empty { padding: 28px 16px; text-align: center; color: var(--ink-2); background: var(--surface); border: 1px dashed var(--line-strong); border-radius: var(--r-lg); }
.foot { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 13px; color: var(--ink-3); }

/* problem view */
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; font-size: 13px; color: var(--ink-2); }
.crumb a { text-decoration: none; font-weight: 600; color: var(--accent-text); }
.crumb a:hover { text-decoration: underline; }
.crumb .pos { margin-left: auto; font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.q h1 { font-weight: 700; font-size: clamp(24px, 22.3px + 0.44vw, 28px); line-height: 1.18; letter-spacing: -0.03em; margin: 14px 0 8px; text-wrap: balance; }
.metaRow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { font-size: 12px; color: var(--ink-2); background: var(--tint); border-radius: 999px; padding: 2px 9px; }
.prose { font-size: 16px; line-height: 1.6; max-width: 760px; color: var(--ink); }
.prose mjx-container[display="true"] { margin: 0.4em 0 !important; }
.prose p { margin: 0 0 0.75em; }
.prose p, .prose li, .trap .prose, .choice .prose { overflow-x: auto; overflow-y: hidden; max-width: 100%; }
.q, .sol, .choices, .prompt { min-width: 0; }
.prose p:last-child { margin-bottom: 0; }
.prose ul, .prose ol { margin: 0 0 0.75em; padding-left: 1.3em; }
.prose li { margin: 0.2em 0; }
.prose .dm { display: block; margin: 0.6em 0; overflow-x: auto; overflow-y: hidden; max-width: 100%; }
.prose pre { font-family: var(--mono); font-size: 13px; line-height: 1.5; background: var(--inset); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; overflow-x: auto; margin: 0 0 0.75em; }
.prose code { font-family: var(--mono); font-size: 0.86em; background: var(--tint); padding: 1px 5px; border-radius: 4px; }
.prose pre code { background: transparent; padding: 0; font-size: inherit; }
mjx-container { max-width: 100%; }
.prompt { margin-top: 18px; font-size: 18px; }
.choices { display: grid; gap: 10px; margin-top: 22px; max-width: 760px; }
.choice { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; align-items: center; text-align: left; width: 100%;
  background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-md); padding: 12px 14px; box-shadow: var(--shadow-sm); }
.choice:not(:disabled):hover { border-color: var(--accent-hover); background: var(--inset); }
.choice .k { width: 28px; height: 28px; border-radius: var(--r-sm); background: var(--tint); display: grid; place-items: center; font-size: 13px; font-weight: 600; }
.choice:disabled { cursor: default; color: var(--ink); opacity: 1; box-shadow: none; }
.choice.right { border-color: var(--easy); background: var(--easy-soft); }
.choice.right .k { background: var(--easy); color: var(--surface); }
.choice.wrong { border-color: var(--hard); background: var(--hard-soft); }
.choice.wrong .k { background: var(--hard); color: var(--surface); }
.choice.dim { opacity: 0.62; }
.verdict { margin-top: 20px; font-weight: 600; font-size: 16px; }
.verdict.ok { color: var(--easy); } .verdict.miss { color: var(--hard); }
.sol { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 18px; max-width: 760px; }
.sol h2 { font-size: 12px; font-weight: 600; color: var(--ink-3); margin: 0 0 8px; }
.trap { margin-top: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); padding: 12px 14px; }
.trap .prose { font-size: 14px; color: var(--ink-2); }
.nav { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; align-items: center; }
.nav .sp { margin-left: auto; }
.hint { font-size: 12px; color: var(--ink-4); margin-top: 14px; }
kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line-strong); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--surface); }
.confirm { display: inline-flex; gap: 8px; align-items: center; }


/* progress dashboard */
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 20px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 14px 16px; box-shadow: var(--shadow-sm); min-width: 0; }
.stat .v { font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; font-variant-numeric: tabular-nums; }
.stat .v small { font-size: 13px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
.stat .l { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
.cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 12px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; box-shadow: var(--shadow-sm); min-width: 0; }
.panel h2, .sec { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 4px; }
.panel .note { font-size: 13px; color: var(--ink-3); margin: 0 0 8px; }
.panel ul { list-style: none; margin: 0; padding: 0; }
.panel li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.panel li b { font-weight: 600; flex: 1 1 150px; min-width: 0; overflow-wrap: anywhere; }
.panel li .num { font-variant-numeric: tabular-nums; color: var(--ink-2); font-size: 13px; }
.linkbtn { border: 0; background: transparent; padding: 0; color: var(--accent-text); font-weight: 600; font-size: 13px; text-decoration: none; }
.linkbtn:hover { text-decoration: underline; }
.sec { margin: 28px 0 4px; }
.secnote { font-size: 13px; color: var(--ink-3); margin: 0 0 10px; max-width: 70ch; }
.ttable { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
.trow { display: grid; grid-template-columns: minmax(0, 1.5fr) 56px minmax(120px, 1fr) 150px 112px; gap: 14px; align-items: center; padding: 10px 16px; border-top: 1px solid var(--line); }
.trow:first-child { border-top: 0; }
.trow.hd { font-size: 12px; color: var(--ink-3); background: var(--inset); padding-block: 8px; }
.trow a.nm { font-weight: 600; text-decoration: none; overflow-wrap: anywhere; }
.trow a.nm:hover { color: var(--accent-text); text-decoration: underline; }
.trow .cov, .trow .emh { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.acc { display: grid; grid-template-columns: minmax(0, 1fr) 40px; gap: 10px; align-items: center; }
.acc .bar { margin: 0; height: 8px; border-radius: 4px; }
.acc .bar i { background: var(--path); border-radius: 4px; }
.acc span { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; text-align: right; }
.acc span.na { font-weight: 400; color: var(--ink-4); }
.trow .lab { justify-self: start; }
@media (max-width: 860px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cols { grid-template-columns: minmax(0, 1fr); }
  .trow { grid-template-columns: minmax(0, 1fr) auto; gap: 6px 12px; }
  .trow.hd { display: none; }
  .trow .acc { grid-column: 1 / -1; }
  .trow .cov::after { content: " answered"; }
  .trow .emh { grid-column: 1; }
}
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 18px; }
  .rail { position: static; max-height: none; overflow: visible; padding: 0; }
  .rail ul { flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px; }
  .rail li { flex: 0 0 auto; }
  .topic { width: auto; grid-template-columns: auto auto; border: 1px solid var(--line-strong); background: var(--surface); padding: 6px 10px; border-radius: 999px; }
  .topic .n { white-space: nowrap; }
  .topic .bar { display: none; }
  .prompt { font-size: 16px; }
  .count { margin-left: 0; width: 100%; }
  .hint { display: none; }
}
@media (prefers-reduced-motion: no-preference) { .bar i { transition: width 0.35s ease; } }
</style>

  if (window.MutationObserver) new MutationObserver(redrawPaths).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

  load();
  fetch("bank.json").then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }).then(function (data) {
    bank = data; var order = {}; bank.topics.forEach(function (t, i) { order[t.slug] = i; });
    var dOrder = { easy: 0, medium: 1, hard: 2 };
    bank.questions.sort(function (a, b) { return (order[a.topic] - order[b.topic]) || (dOrder[a.difficulty] - dOrder[b.difficulty]) || a.id.localeCompare(b.id); });
    bank.questions.forEach(function (q) { byId[q.id] = q; });
    Object.keys(progress).forEach(function (id) { if (!byId[id]) delete progress[id]; });
    var r = route(); if (r.q) lastTopic = byId[r.q].topic;
    render(); redrawPaths();
  }).catch(function () { main.innerHTML = '<p class="empty">The problem bank could not be loaded. Reload the page to try again.</p>'; });
  drawPath(document.getElementById("mark"), 1905, false);
})();
</script>
